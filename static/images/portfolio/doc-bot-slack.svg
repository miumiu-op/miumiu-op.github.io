<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Doc bot Slack workflow mock</title>
  <desc id="desc">Illustrative Slack thread: feedback is captured by the doc bot, acknowledged, and posted to the feedback inbox.</desc>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f5064" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="520" fill="#f4f1ed"/>
  <rect x="48" y="36" width="624" height="448" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="48" y="36" width="180" height="448" rx="18" fill="#3f0e40"/>
  <rect x="192" y="36" width="36" height="448" fill="#3f0e40"/>
  <text x="72" y="78" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">tech-writing</text>
  <text x="72" y="118" fill="#c7a3c9" font-family="Helvetica, Arial, sans-serif" font-size="12">Channels</text>
  <rect x="64" y="136" width="148" height="28" rx="6" fill="#1164a3"/>
  <text x="78" y="155" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="13"># api-help</text>
  <text x="78" y="192" fill="#d3c3d6" font-family="Helvetica, Arial, sans-serif" font-size="13"># tw-feedback-inbox</text>
  <text x="78" y="224" fill="#d3c3d6" font-family="Helvetica, Arial, sans-serif" font-size="13"># docs-release</text>

  <text x="260" y="78" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700"># api-help</text>
  <text x="260" y="102" fill="#616061" font-family="Helvetica, Arial, sans-serif" font-size="12">3 members · Doc feedback thread</text>
  <line x1="248" y1="118" x2="648" y2="118" stroke="#e8e8e8"/>

  <circle cx="276" cy="156" r="16" fill="#2bac76"/>
  <text x="270" y="161" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">D</text>
  <text x="304" y="152" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Dev</text>
  <text x="338" y="152" fill="#616061" font-family="Helvetica, Arial, sans-serif" font-size="11">10:12</text>
  <text x="304" y="176" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="13">@doc-bot the webhook retry page is confusing.</text>
  <text x="304" y="196" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="13">We keep getting the same question from customers.</text>

  <circle cx="276" cy="250" r="16" fill="#611f69"/>
  <text x="269" y="255" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">DB</text>
  <text x="304" y="246" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">doc-bot</text>
  <text x="364" y="246" fill="#2bac76" font-family="Helvetica, Arial, sans-serif" font-size="11">APP</text>
  <text x="398" y="246" fill="#616061" font-family="Helvetica, Arial, sans-serif" font-size="11">10:12</text>
  <rect x="304" y="258" width="320" height="54" rx="10" fill="#f8f8f8" stroke="#e8e8e8"/>
  <text x="318" y="280" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="13">Got it. Logged as DOC-128 [done]</text>
  <text x="318" y="300" fill="#616061" font-family="Helvetica, Arial, sans-serif" font-size="12">Posted to #tw-feedback-inbox for triage.</text>

  <rect x="304" y="326" width="110" height="28" rx="14" fill="#ffffff" stroke="#dddddd"/>
  <text x="318" y="345" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="13">watching 1</text>
  <rect x="424" y="326" width="92" height="28" rx="14" fill="#ffffff" stroke="#dddddd"/>
  <text x="440" y="345" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="13">done 1</text>

  <rect x="260" y="384" width="364" height="72" rx="12" fill="#f0f9ff" stroke="#b6e0fe"/>
  <text x="280" y="412" fill="#0b4f8a" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">#tw-feedback-inbox</text>
  <text x="280" y="434" fill="#1d1c1d" font-family="Helvetica, Arial, sans-serif" font-size="12">DOC-128 · webhook retry docs · from #api-help</text>
  <text x="520" y="412" fill="#0b4f8a" font-family="Helvetica, Arial, sans-serif" font-size="12">status: open</text>
</svg>
