    intro: "Hi, I'm"
    title: "Miaomiao"
    subtitle: "Life is short and hard, but work can make it longer"
    content: "Not a big fan of labels, but if I have to pick some, I'd say technical writer, vibe coder, INFJ, and KPop lover."
    image: /images/me.png
