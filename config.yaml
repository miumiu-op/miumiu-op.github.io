        button:
          name: "联系我"
      about:
        title: "关于我"
        content: |-
          我叫 Miaomiao Pan，你也可以叫我 Miumiu，朋友们都这么叫我。

          过去几年，我深耕技术写作领域，专注于面向用户的内容创作，包括技术文档的撰写与翻译、产品 UI 文案，以及其他各种形式的用户支持内容。

          我尤其关注 AI 驱动的文档工程与自动化工具在流程优化中的应用，并成功落地相关实践，优化用户体验和提升效率与生产力。
        skills:
          title: "以下是我掌握的一些技能："
          items:
            - "AI 与自动化：提示工程、Cursor、Windsurf、n8n、Python"
            - "内容技术栈：DITA（Oxygen、IXIA CCMS）、Markdown、XML/HTML、API 文档"
            - "协作与设计：Git、Jira、VS Code、Figma、Snagit"
            - "Vibe Coding：借助 AI 工具独立开发网页端应用"
      experience:
        title: "工作经验"
        items:
          - job: "技术写作者"
            company: "Cobo"
            date: "2024.06 - 2026.01"
            content: |
              在 Cobo，我负责 Custody/WaaS 业务线的文档工作，确保全覆盖并快速迭代。主要贡献包括：

              - 主导交付 13 万字的双语《数字资产安全手册》。
              - 借助 AI 与数据分析提升开发者体验与文档效率。
              - 开发自动化机器人（Slack、n8n）以优化用户反馈与内容流程。
          - job: "技术写作者"
            company: "Agora"
            date: "2022.05 - 2023.07"
            content: |
              在 Agora.io（即声网）期间，我负责双语发布说明与 API 文档，并优化协作流程。除此之外，我还：

              - 使用 ChatGPT 编写 Python 自动化脚本，用于语法检查、样式更新与文件生成。
              - 引入 Jira 规范协作流程，提升任务跟踪效率。
              - 优化 API 文档工具链与 XML 转 JSON 转换逻辑。
          - job: "用户帮助开发者"
            company: "SAP"
            date: "2019.11 - 2022.05"
            content: |
              在 SAP 任职期间，我与产品经理和工程师协作，产出面向客户的内容。除此之外，我还：

              - 编写跨产品功能的集成指南。
              - 协助本地团队引入 Jira，提高团队效率。
              - 使用 Snagit 制作演示视频，降低用户学习成本。
          - job: "技术写作者"
            company: "KUKA Robotics"
            date: "2019.04 - 2019.11"
            content: |
              与产品经理和工程师协作交付基于 DITA 的机器人操作系统文档，负责翻译供应商管理与质量审查，并完成机器人操作系统相关培训。
      education:
        enable: false
